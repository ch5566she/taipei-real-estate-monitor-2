name: 執行房市監控程式

on:
  workflow_dispatch:

  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:

  run-monitor:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # 下載專案
      # ----------------------------------------------------

      - name: 下載專案程式
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 設定 Python
      # ----------------------------------------------------

      - name: 設定 Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # 執行主程式
      # ----------------------------------------------------

      - name: 執行主程式
        run: python main.py

      # ----------------------------------------------------
      # 抓取房價資料
      # ----------------------------------------------------

      - name: 執行房價資料蒐集
        run: python data_collector.py
      - name: 執行在售案源整理
        run: python listing_collector.py

      # ----------------------------------------------------
      # 房價分析
      # ----------------------------------------------------

      - name: 執行房價分析
        run: python analyzer.py
        
      # ----------------------------------------------------
      # 第20階段
      # 在售物件 × 實價成交比價
      # ----------------------------------------------------

      - name: 執行在售物件實價比價
        run: python listing_comparator.py
        
      # ----------------------------------------------------
      # 第九階段
      # 自動產生每日房市報告
      # ----------------------------------------------------

      - name: 產生每日房市報告
        run: python report.py

      # ----------------------------------------------------
      # 保存房價原始資料
      # ----------------------------------------------------

      - name: 保存房價資料
        uses: actions/upload-artifact@v4

        with:
          name: taipei-real-estate-data
          path: data/taipei_transactions.csv
          retention-days: 7

      # ----------------------------------------------------
      # 將歷史資料、每日報告回存 GitHub
      # ----------------------------------------------------

      - name: 將資料與報告回存 GitHub

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current_listings.csv data/taipei_transactions.csv history/ reports/

          if git diff --cached --quiet; then

            echo "沒有新的資料或報告需要 Commit"

          else

            git commit -m "自動更新每日房市資料與房市報告"
            
            git pull --rebase origin main
            
            git push

          fi

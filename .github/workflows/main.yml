name: 執行房市監控程式

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write
  
jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案程式
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行主程式
        run: python main.py

      - name: 執行房價資料蒐集
        run: python data_collector.py

      - name: 執行房價分析
        run: python analyzer.py
  
      - name: 保存房價資料
        uses: actions/upload-artifact@v4
        with:
          name: taipei-real-estate-data
          path: data/taipei_transactions.csv
          retention-days: 7

name: 執行房市監控程式

on:
  workflow_dispatch:

  schedule:
    # UTC 01:00 = 台灣時間 09:00
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 下載專案
      # ==============================

      - name: 下載專案程式
        uses: actions/checkout@v4

      # ==============================
      # 設定 Python
      # ==============================

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==============================
      # 執行主程式
      # ==============================

      - name: 執行主程式
        run: python main.py

      # ==============================
      # 執行房價資料蒐集
      # ==============================

      - name: 執行房價資料蒐集
        run: python data_collector.py

      # ==============================
      # 執行在售案源整理
      # ==============================

      - name: 執行在售案源整理
        shell: bash
        run: |
          if [ -f "data/raw_listings.csv" ]; then
            echo "找到 data/raw_listings.csv"
            echo "開始整理在售物件"

            python listing_collector.py \
              data/raw_listings.csv \
              data/current_listings.csv
          else
            echo "沒有 data/raw_listings.csv"
            echo "略過今日在售案源整理"

            rm -f data/current_listings.csv
            rm -f data/listing_comparison.json
          fi

      # ==============================
      # 執行房價分析
      # ==============================

      - name: 執行房價分析
        run: python analyzer.py

      # ==============================
      # 在售物件 × 實價成交比價
      # 優先使用第26階段
      # ==============================

      - name: 執行在售物件實價比價
        shell: bash
        run: |
          if [ -f "data/current_listings.csv" ]; then

            echo "=========================================="
            echo "開始執行在售物件 × 實價成交比價"
            echo "=========================================="

            if [ -f "listing_comparator_stage26.py" ]; then

              echo "使用第26階段房仲實戰定價引擎"
              echo "listing_comparator_stage26.py"

              python listing_comparator_stage26.py

            elif [ -f "listing_comparator.py" ]; then

              echo "找不到第26階段程式"
              echo "改用舊版 listing_comparator.py"

              python listing_comparator.py

            else

              echo "錯誤：找不到任何比價程式"
              exit 1

            fi

          else

            echo "=========================================="
            echo "沒有 data/current_listings.csv"
            echo "略過在售物件實價比價"
            echo "=========================================="

            rm -f data/listing_comparison.json

          fi

      # ==============================
      # 產生每日房市報告
      # ==============================

      - name: 產生每日房市報告
        run: python report.py

      # ==============================
      # 保存房價資料
      # ==============================

      - name: 保存房價資料
        uses: actions/upload-artifact@v4
        with:
          name: taipei-real-estate-data
          path: data/taipei_transactions.csv
          if-no-files-found: error
          retention-days: 7

      # ==============================
      # 將資料與報告回存 GitHub
      # ==============================

      - name: 將資料與報告回存 GitHub
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/taipei_transactions.csv
          git add history/
          git add reports/

          if [ -f "data/current_listings.csv" ]; then
            git add data/current_listings.csv
          else
            git add -u -- data/current_listings.csv 2>/dev/null || true
          fi

          if [ -f "data/listing_comparison.json" ]; then
            git add data/listing_comparison.json
          else
            git add -u -- data/listing_comparison.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then

            echo "沒有新的資料或報告需要 Commit"

          else

            echo "準備提交每日房市資料與房市報告"

            git commit -m "自動更新每日房市資料與房市報告"

            git pull --rebase origin main

            git push

            echo "GitHub 資料回存完成"

          fi

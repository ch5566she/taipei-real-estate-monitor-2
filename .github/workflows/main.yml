name: 台北市士林區北投區房市監控

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 取得 Repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 設定 Python
      # ============================================================

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. 顯示 Python 版本
      # ============================================================

      - name: 檢查 Python
        run: |
          python --version

      # ============================================================
      # 4. 官方實價成交資料
      # ============================================================

      - name: 取得官方實價資料
        run: |
          python data_collector.py

      # ============================================================
      # 5. 在售房源資料匯入
      #
      # incoming_listings.csv
      #        ↓
      # listing_importer.py
      #        ↓
      # raw_listings.csv
      # ============================================================

      - name: 匯入在售房源資料
        run: |
          python listing_importer.py

      # ============================================================
      # 6. 在售房源資料整理
      #
      # raw_listings.csv
      #        ↓
      # listing_collector.py
      #        ↓
      # current_listings.csv
      # ============================================================

      - name: 整理目前在售房源
        run: |
          python listing_collector.py \
            data/raw_listings.csv \
            data/current_listings.csv

      # ============================================================
      # 7. 房源比較
      # ============================================================

      - name: 執行房源比較
        run: |
          python listing_comparator_stage26.py

      # ============================================================
      # 8. 目前仍使用既有正式 pricing_engine.py
      #
      # ⚠️ 本階段不切換 V6.2
      # ============================================================

      - name: 執行既有價格決策
        run: |
          python pricing_engine.py

      # ============================================================
      # 9. 產生報告
      # ============================================================

      - name: 產生房市報告
        run: |
          python report.py

      # ============================================================
      # 10. 顯示目前資料數量
      # ============================================================

      - name: 檢查輸出資料
        run: |
          echo "=========================================="
          echo "第43階段：資料管線檢查"
          echo "=========================================="

          if [ -f data/incoming_listings.csv ]; then
            echo "incoming_listings.csv：存在"
            wc -l data/incoming_listings.csv
          else
            echo "incoming_listings.csv：不存在"
          fi

          if [ -f data/raw_listings.csv ]; then
            echo "raw_listings.csv：存在"
            wc -l data/raw_listings.csv
          else
            echo "raw_listings.csv：不存在"
          fi

          if [ -f data/current_listings.csv ]; then
            echo "current_listings.csv：存在"
            wc -l data/current_listings.csv
          else
            echo "current_listings.csv：不存在"
          fi

          if [ -f data/pricing_decisions.csv ]; then
            echo "pricing_decisions.csv：存在"
            wc -l data/pricing_decisions.csv
          else
            echo "pricing_decisions.csv：不存在"
          fi

          echo "=========================================="

      # ============================================================
      # 11. Commit 自動更新資料
      # ============================================================

      - name: 儲存每日資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data history reports || true

          git diff --cached --quiet || \
            git commit -m "每日房市資料更新"

          git push || true
